name: croc_city_football_academy
description: Croc City Football Academy Management System

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Routing
  go_router: ^16.2.1

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  cloud_functions: ^6.5.0

  # UI
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  lottie: ^3.3.2

  # Utilities
  intl: ^0.20.2
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  fl_chart: ^1.1.1
  uuid: ^4.5.1
  paystack_flutter_sdk: ^0.0.1-alpha.2
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  